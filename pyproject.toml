[project]
name = "time_tracker"
authors = [
    { name = "Nitin Kumar", email = "199nitinkumar@gmail.com" }
]
description = "Time Tracker with correction approvals and ERPNext/HRMS payroll integration"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
hrms = ">=15.0.0,<17.0.0"
